dataset:
  type: "tum_rgbd"
  name: "freiburg3_long_office_household"
  root: "data/tum/rgbd_dataset_freiburg3_long_office_household"

depth:
  scale: 5000.0

camera:
  fx: 535.4
  fy: 539.2
  cx: 320.1
  cy: 247.6
  width: 640
  height: 480

sync:
  rgb_depth_max_dt: 0.02
  rgb_pose_max_dt: 0.02

perception:
  type: "yoloe"
  model_path: "models/yoloe-26m-seg.pt"
  confidence_threshold: 0.3
  classes: ["monitor", "computer", "keyboard", "mouse", "telephone", "book", "cup", "pen", "paper", "bottle", "desk", "table"]

tracking:
  association_method: "hungarian"
  association_threshold_m: 0.3
  max_missing_frames: 10

temporal:
  object:
    min_hits_to_confirm: 3
    max_missing_frames: 5
  relation:
    confirm_frames: 2
    max_missing_frames: 2

roles:
  support_surface: ["desk", "table"]
  container: []
  ordinary_object: ["monitor", "computer", "keyboard", "mouse", "telephone", "book", "cup", "pen", "paper", "bottle"]

relations:
  distance:
    near_threshold: 0.50
    far_threshold: 1.50
  support:
    plane_residual_m: 0.05
    min_support_overlap: 0.05
  directional:
    margin_x: 0.1
    margin_y: 0.1
  containment:
    min_containment_ratio: 0.5
  depth_order:
    depth_margin: 0.1
  occlusion:
    min_mask_overlap_ratio: 0.1
    min_depth_order_ratio: 0.7
    min_valid_depth_samples: 5
    depth_margin: 0.05
