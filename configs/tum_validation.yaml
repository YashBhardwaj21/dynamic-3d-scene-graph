data:
  dataset_dir: "data/tum/rgbd_dataset_freiburg3_long_office_household"
  sequence: "freiburg3_long_office_household"
  sync_threshold: 0.02
  depth_scale: 5000.0

perception:
  detector: "yoloe_26m"
  confidence_threshold: 0.3
  classes: ["monitor", "computer", "keyboard", "mouse", "telephone", "book", "cup", "pen", "paper", "bottle", "desk", "table"]

tracking:
  distance_threshold: 0.3
  velocity_weight: 0.5
  max_missing: 10

temporal:
  object:
    hysteresis_frames: 3
  relation:
    confirmation_frames: 2
    missing_frames: 2

roles:
  support_surface: ["desk", "table"]
  container: []
  ordinary_object: ["monitor", "computer", "keyboard", "mouse", "telephone", "book", "cup", "pen", "paper", "bottle"]

relations:
  distance:
    near_threshold: 0.50
    far_threshold: 1.50
  support:
    plane_residual_m: 0.05
    min_support_overlap: 0.05
  directional:
    margin_x: 0.1
    margin_y: 0.1
  containment:
    min_containment_ratio: 0.5
  depth_order:
    depth_margin: 0.1
  occlusion:
    min_mask_overlap_ratio: 0.1
    min_depth_order_ratio: 0.7
    min_valid_depth_samples: 5
    depth_margin: 0.05
