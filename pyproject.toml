[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene_graph"
version = "0.1.0"
description = "Dynamic 3D Scene Graph Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
perception = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python-headless>=4.8.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "ruff",
    "mypy",
]
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
]
all = [
    "scene_graph[perception,dev,viz]",
]

[tool.setuptools.packages.find]
where = ["src"]

