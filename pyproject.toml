[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scene_graph"
version = "0.1.0"
description = "Dynamic 3D Scene Graph Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "opencv-python",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
